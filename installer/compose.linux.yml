name: alias-server
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alias
      POSTGRES_USER: alias
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run install-linux.sh first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alias -d alias"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: ${BACKEND_PORT:-5081}
      ConnectionStrings__Default: Host=db;Port=5432;Database=alias;Username=alias;Password=${DB_PASSWORD}
      Database__AutoMigrate: "true"
      Seed__DemoData: "false"
      Swagger__Enabled: "false"
      AllowedHosts: "*"
      Storage__Root: /app/uploads
      Ocr__Provider: AI_STUDIO
      Ocr__CloudModel: PP-OCRv6
      Ocr__MaxConcurrentJobs: ${OCR_CONCURRENT_JOBS:-2}
      Ocr__MaxQueuedJobs: ${OCR_QUEUED_JOBS:-32}
      Ocr__QueueWaitSeconds: "600"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5081}:${BACKEND_PORT:-5081}"
    volumes:
      - documents:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        API_PROXY_URL: http://backend:${BACKEND_PORT:-5081}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-3002}:3000"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  database:
  documents:
